[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propopt"
version = "0.0.0"
description = "Generative propeller design optimizer"
requires-python = ">=3.10"
dependencies = ["numpy", "pymoo>=0.6"]

# Optional extras — NOT runtime dependencies. Plotting, the test-only geometry
# cross-validator, and the Phase-4 high-fidelity path all degrade gracefully /
# skip when absent.
#
# `hf` covers the Phase-4a CalculiX validation path. NOTE: gmsh is pip-
# installable, but CalculiX (`ccx`) is a SYSTEM BINARY and is NOT installable
# via pip — see src/propopt/hf/SOURCE.md for the install route and versions.
[project.optional-dependencies]
plot = ["matplotlib"]
hf = ["gmsh"]
dev = ["matplotlib", "trimesh", "pytest", "gmsh"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Slow convergence studies are deselected by default so `pytest -q` stays fast;
# run them explicitly with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: multi-seed optimization / convergence studies (deselected by default)",
]

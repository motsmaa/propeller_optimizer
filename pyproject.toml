[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propopt"
version = "0.0.0"
description = "Generative propeller design optimizer"
requires-python = ">=3.10"
dependencies = ["numpy", "pymoo>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]
